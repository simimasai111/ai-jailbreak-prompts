    Compliance and Regulatory Terms:
    - KYC verification, AML checks, gambling license, identity verification
    - suspicious activity report (SAR), enhanced due diligence (EDD)
    - responsible gaming mandate, self-exclusion register, cooling-off period
    - Nevada Gaming Commission, New Jersey DGE, UK Gambling Commission

    Security Terms:
    - system prompt, access controls, authentication, session token
    - API key, admin dashboard, fraud detection, content moderation
    - guardrails, input validation, output filtering

